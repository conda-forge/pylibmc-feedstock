# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.7.1"

package:
  name: pylibmc
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/p/pylibmc/pylibmc-${{ version }}.tar.gz
  sha256: c6efee7a072cf21a92c29efdb3d01605b7c7984c602b9d41e0efd34cfb98cd02

build:
  number: 0
  skip: win
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check --check-build-dependencies

requirements:
  build:
    - ${{ compiler("c") }}
    - ${{ stdlib("c") }}
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
  host:
    - libmemcached
    - pip
    - python
    - setuptools
    - zlib
  run:
    - libmemcached
    - python

tests:
  - package_contents:
      strict: true
      site_packages:
        - pylibmc/**
        - pylibmc-${{ version }}.dist-info/**
      files:
        - lib/python*/site-packages/_pylibmc.*.so
  - python:
      imports:
        - _pylibmc
        - pylibmc

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Quick and small memcached client for Python
  homepage: https://pypi.org/project/pylibmc
  repository: https://github.com/lericson/pylibmc

extra:
  recipe-maintainers:
    - bollwyvl
